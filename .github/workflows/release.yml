name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine next version tag
        id: version
        run: |
          TODAY=$(date +%Y%m%d)
          TAGS=$(curl -s https://api.github.com/repos/${{ github.repository }}/tags | jq -r '.[].name')
          MAX=0
          for tag in $TAGS; do
            if [[ "$tag" =~ ^v${TODAY}\.([0-9]+)$ ]]; then
              N="${BASH_REMATCH[1]}"
              if (( N > MAX )); then MAX=$N; fi
            fi
          done
          NEXT=$((MAX + 1))
          VERSION="v${TODAY}.${NEXT}"
          echo "TAG=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package dist
        run: |
          cd dist
          zip -r ../dist.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: X to Markdown ${{ steps.version.outputs.TAG }}
          body: |
            ## X to Markdown ${{ steps.version.outputs.TAG }}

            将 X 帖子保存为本地 Markdown 归档。

            ### 安装步骤
            1. 下载下方 `dist.zip` 并解压
            2. 打开 `chrome://extensions/`
            3. 开启「开发者模式」
            4. 点击「加载已解压的扩展程序」，选择解压出的 `dist` 文件夹

            ### 更新方法
            重新加载扩展，或删除后重新安装。
          files: dist.zip
          draft: false
          prerelease: false
